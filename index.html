<title>Rush Glovo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen phone game. HUD + order tickets (DOM) over a top-down pizza kitchen (canvas); event cards pause play. Single committed look: Glovo yellow ground. */
:root{
  --sun:#FFC244; --pepper:#14221B; --pepper-2:#1F3328; --pepper-3:#2C4637;
  --mint:#00A082; --mint-soft:#7FD9C4; --chili:#FF5A4E; --cream:#F4F7F5; --mute:#9DB2A6; --paper:#FFF8E6; --ink:#14221B;
  --display:"Bricolage Grotesque","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --arabic:"Tajawal","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--sun);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-top:8px;
  padding-bottom:calc(8px + var(--host-gap,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html[lang="ar"] body, html[lang="ar"] button, html[lang="ar"] input{font-family:var(--arabic)}
html[lang="ar"] .panel h2, html[lang="ar"] .card h3, html[lang="ar"] .tk .n{font-family:var(--arabic)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--pepper);outline-offset:2px}
.app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px;position:relative}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em;line-height:1;direction:ltr}
.brand h1 span{background:var(--pepper);color:var(--sun);padding:0 6px;border-radius:6px;margin-left:3px}
.brand small{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-inline-start:auto}
.snd{display:inline-flex;align-items:center;gap:4px;background:var(--pepper);color:var(--sun);font-size:11px;font-weight:800;padding:5px 9px;border-radius:99px;align-self:center}
.snd[aria-pressed="false"]{background:transparent;color:var(--pepper);outline:1.5px solid var(--pepper)}

/* HUD */
.hud{background:var(--pepper);color:var(--cream);border-radius:16px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.clock{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1;direction:ltr}
.clock small,.gmv small{display:block;font-family:inherit;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin-top:2px}
.gmv{text-align:end;font-variant-numeric:tabular-nums;line-height:1}
.gmv b{font-family:var(--display);font-size:20px;font-weight:800;color:var(--sun)}
.ps .lbl{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.ps .lbl b{color:var(--cream);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:var(--pepper-3);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:100%;background:var(--mint);border-radius:99px;transition:width .3s,background .3s}
.sub{display:flex;gap:10px;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;grid-column:1/-1;margin-top:-2px;flex-wrap:wrap}
.sub b{color:var(--cream)} .sub .st{margin-inline-start:auto;font-weight:800;color:var(--mint-soft)} .sub .st.off{color:var(--chili)} .sub .st.busy{color:var(--sun)}

/* tickets */
.rail{display:flex;gap:6px;overflow-x:auto;min-height:94px;padding:2px 2px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .none{font-size:13px;font-weight:600;color:var(--pepper);opacity:.75;align-self:center;padding-inline-start:6px}
.tk{flex:0 0 116px;background:var(--paper);border-radius:10px;padding:8px 8px 8px;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 0 rgba(20,34,27,.25);position:relative;border:2px solid transparent}
.tk::before{content:"";position:absolute;top:-2px;left:12px;right:12px;height:5px;border-radius:0 0 6px 6px;background:var(--pepper-3)}
.tk.new{border-color:var(--pepper);animation:ring .8s ease-in-out infinite alternate}
@keyframes ring{to{transform:translateY(-2px)}}
.tk.flag{border-color:var(--chili)} .tk.onboard{border-color:var(--mint)}
.tk .h{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800}
.tk .h em{font-style:normal;color:var(--mint)}
.tk .n{font-family:var(--display);font-weight:800;font-size:14px;line-height:1.1}
.tk .ing{display:flex;gap:3px}
.tk .ing i{width:14px;height:14px;border-radius:50%;display:block;border:1.5px solid rgba(20,34,27,.25)}
.tk .meter{height:5px;border-radius:99px;background:rgba(20,34,27,.12);overflow:hidden}
.tk .meter i{display:block;height:100%;background:var(--pepper)}
.tk .meter.warn i{background:var(--chili)}
.tk .st{font-size:11px;font-weight:700;color:#5b6b62}
.tk button{font-size:12.5px;font-weight:800;padding:7px 4px;border-radius:8px}
.tk .acc{background:var(--pepper);color:var(--sun)}
.tk .row{display:flex;gap:4px} .tk .row button{flex:1}
.tk .call{background:var(--mint);color:#fff} .tk .cx{background:transparent;color:var(--chili);border:1.5px solid var(--chili)}

/* campaigns */
.camp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.camp button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--pepper);color:var(--sun);padding:8px 10px;border-radius:12px;box-shadow:0 2px 0 rgba(20,34,27,.3)}
.camp button b{font-family:var(--display);font-size:15px}
.camp button small{font-size:11.5px;font-weight:700;color:var(--mute)}
.camp button.on{background:var(--mint);color:#fff;animation:ring .8s ease-in-out infinite alternate} .camp button.on small{color:#fff}
.camp button[disabled]:not(.on){opacity:.5}
html[lang="ar"] .camp button b{font-family:var(--arabic)}
/* kitchen */
.stage{flex:1;min-height:0;position:relative;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
canvas{display:block;border-radius:16px;touch-action:none;box-shadow:0 12px 30px -16px rgba(20,34,27,.6);max-width:100%}
.pop{position:absolute;z-index:6;pointer-events:none;transform:translateY(-50%);max-height:calc(100% - 16px);overflow:hidden;background:var(--cream);color:var(--ink);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;box-shadow:0 14px 34px -12px rgba(0,0,0,.6);transition:opacity .25s,transform .25s}
.pop.hide{opacity:0;transform:translateY(calc(-50% + 8px))}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--cream);background:var(--pepper)}
.bad .av{background:var(--chili)} .good .av{background:var(--mint)} .event .av{background:var(--sun);color:var(--pepper)}
.pop b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#5b6b62}
.pop p{margin:3px 0 0;font-size:16px;font-weight:700;line-height:1.35}

/* panels & cards */
.sheet{position:absolute;inset:0;z-index:10;background:rgba(20,34,27,.6);display:flex;align-items:flex-end;justify-content:center;padding:8px}
.sheet.center{align-items:center}
.panel{width:100%;max-width:460px;background:var(--pepper);color:var(--cream);border-radius:20px;padding:16px;display:grid;gap:10px;max-height:100%;overflow:auto}
.panel h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0;line-height:1.15;text-wrap:balance}
.panel p{margin:0;line-height:1.5;font-size:14.5px}
.card{width:100%;max-width:420px;background:var(--cream);color:var(--ink);border-radius:22px;padding:20px;display:grid;gap:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7);animation:popin .25s ease-out}
@keyframes popin{from{transform:scale(.94);opacity:.4}}
.card .who{display:flex;gap:12px;align-items:center}
.card .who b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#5b6b62}
.card h3{margin:0;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.35;text-wrap:pretty}
.card .cta{background:var(--pepper);color:var(--sun)}
.cardbtns{display:grid;gap:8px}
.ghost2{background:transparent;color:var(--ink);border:1.5px solid rgba(20,34,27,.35);padding:12px 14px;font-weight:800;font-size:15px}
.tabhint{background:var(--sun);color:var(--pepper);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;line-height:1.4}
.openbtn{background:var(--mint);color:#fff;font-weight:800;font-size:16px;padding:13px}
.openbtn[disabled]{opacity:.4;cursor:default}
.closebtn{background:var(--chili);color:#fff;font-weight:800;font-size:16px;padding:13px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sun)}
.muted{color:var(--mute)}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.langs button{background:var(--pepper-2);color:var(--cream);font-weight:800;padding:11px 6px;border:2px solid var(--pepper-3)}
.langs button[aria-pressed="true"]{border-color:var(--sun);color:var(--sun)}
.langs button[data-l="ar"]{font-family:var(--arabic)} #langs button[hidden]{display:none}
.toggles{display:grid;gap:6px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--pepper-2);color:var(--cream);padding:11px 12px;border-radius:12px;font-weight:700;text-align:start}
.tg .sw{width:38px;height:22px;border-radius:99px;background:var(--mint);position:relative;flex:0 0 auto;direction:ltr}
.tg .sw::after{content:"";position:absolute;top:3px;left:19px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tg.off .sw{background:var(--pepper-3)} .tg.off .sw::after{left:3px}
.tg small{display:block;font-size:11.5px;font-weight:700;color:var(--chili)}
.cta{background:var(--sun);color:var(--pepper);font-weight:800;font-size:16px;padding:13px 16px;font-family:var(--display)}
html[lang="ar"] .cta{font-family:var(--arabic)}
.ghost{background:transparent;color:var(--cream);border:1.5px solid var(--pepper-3);padding:11px 14px;font-weight:700}
.warnbtn{background:var(--chili);color:#fff;font-weight:800;padding:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--mute)}
.field input{background:var(--pepper-2);border:1.5px solid var(--pepper-3);color:var(--cream);border-radius:12px;padding:12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;background:var(--pepper-2);border-radius:12px;padding:9px 11px;font-size:14px;line-height:1.4}
.steps .k{font-family:var(--display);font-weight:800;background:var(--sun);color:var(--pepper);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px}
.steps b{color:var(--sun)}
.big{font-family:var(--display);font-weight:800;font-size:52px;line-height:.95;color:var(--sun);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kpi{background:var(--pepper-2);border-radius:12px;padding:8px 10px}
.kpi small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.kpi b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.kpi.ok b{color:var(--mint-soft)} .kpi.ko b{color:var(--chili)}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tips li{background:var(--pepper-2);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.tips b{color:var(--sun)}
.board{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:r}
.board li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;background:var(--pepper-2);border-radius:10px;padding:7px 10px;font-size:13.5px;counter-increment:r}
.board li::before{content:counter(r);font-family:var(--display);font-weight:800;color:var(--sun)}
.board li.me{outline:2px solid var(--sun)}
.board .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .who small{color:var(--mute)} .board .pts{font-weight:800;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--mute)}
.codebox{background:var(--sun);color:var(--pepper);border-radius:16px;padding:12px 14px;display:grid;gap:2px;text-align:center}
.codebox small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.codebox b{font-family:var(--display);font-size:44px;letter-spacing:.18em;line-height:1.05;direction:ltr}
.codebox p{margin:2px 0 0;font-size:13px;font-weight:700;line-height:1.4;color:var(--pepper)}
.codebox.practice{background:var(--pepper-2);color:var(--cream)} .codebox.practice p{color:var(--mute)}
/* training mode */
.coach{background:var(--pepper);color:var(--cream);border-radius:14px;padding:9px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:2px solid var(--sun)}
.coach .ct{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sun)}
.coach .cs{grid-column:1;font-size:15.5px;font-weight:700;line-height:1.35}
.coach .cs b{color:var(--sun);font-weight:800}
.coach .dots{display:flex;gap:4px;margin-top:3px}
.coach .dots i{width:22px;height:5px;border-radius:99px;background:var(--pepper-3)} .coach .dots i.on{background:var(--sun)} .coach .dots i.ok{background:var(--mint)}
.coach button{grid-column:2;grid-row:1/span 3;background:transparent;color:var(--cream);border:1.5px solid var(--pepper-3);font-size:12px;font-weight:800;padding:8px 10px}
.hl{animation:hl .8s ease-in-out infinite alternate;box-shadow:0 0 0 3px var(--sun),0 0 0 6px var(--pepper)!important}
@keyframes hl{to{transform:scale(1.05)}}
.trlist{display:grid;gap:6px}
.trlist{gap:5px} .trlist button{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--pepper-2);color:var(--cream);padding:8px 12px;border-radius:12px;font-weight:700;text-align:start;font-size:14.5px}
.trlist .k{font-family:var(--display);font-weight:800;background:var(--sun);color:var(--pepper);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px}
.trlist .ok{color:var(--mint-soft);font-weight:800;font-size:16px}
.trlist button.done .k{background:var(--mint);color:#fff}
.ghostY{background:transparent;color:var(--sun);border:1.5px solid var(--sun);padding:12px 14px;font-weight:800;font-size:15px}
/* quiz mode */
body.quiz .hud, body.quiz .camp, body.quiz .rail, body.quiz .coach{display:none!important}
.qbar{display:none;background:var(--pepper);color:var(--cream);border-radius:14px;padding:9px 12px;align-items:center;gap:10px}
body.quiz .qbar{display:flex}
.qbar .qn{font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap;direction:ltr}
.qbar .qd{display:flex;gap:3px;flex:1;min-width:0}
.qbar .qd i{flex:1;height:7px;border-radius:99px;background:var(--pepper-3)} .qbar .qd i.ok{background:var(--mint)} .qbar .qd i.ko{background:var(--chili)} .qbar .qd i.now{background:var(--sun)}
.qbar .qs{font-family:var(--display);font-weight:800;font-size:17px;color:var(--sun);white-space:nowrap}
.qpanel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,470px);z-index:7;background:var(--cream);color:var(--ink);border-radius:20px;padding:14px;display:grid;gap:10px;box-shadow:0 -10px 34px -14px rgba(0,0,0,.6);max-height:100%;overflow:auto}
.qsit{font-size:16.5px;font-weight:700;line-height:1.4;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.qsit .av{width:34px;height:34px;font-size:15px}
.qask{display:grid;gap:8px}
.qask h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.25}
html[lang="ar"] .qask h3{font-family:var(--arabic)}
.qtime{height:7px;border-radius:99px;background:rgba(20,34,27,.12);overflow:hidden} .qtime i{display:block;height:100%;width:100%;background:var(--pepper);border-radius:99px}
.qtime.warn i{background:var(--chili)}
.qopts{display:grid;gap:7px}
.qopts button{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:start;background:#fff;color:var(--ink);border:2px solid rgba(20,34,27,.18);padding:10px 12px;font-size:15px;font-weight:700;line-height:1.3;border-radius:14px}
.qopts button .l{font-family:var(--display);font-weight:800;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sun);color:var(--pepper);font-size:14px}
.qopts button.ok{background:var(--mint);border-color:var(--mint);color:#fff} .qopts button.ok .l{background:#fff;color:var(--mint)}
.qopts button.ko{background:var(--chili);border-color:var(--chili);color:#fff} .qopts button.ko .l{background:#fff;color:var(--chili)}
.qopts button[disabled]:not(.ok):not(.ko){opacity:.45}
.qres{display:grid;gap:8px}
.verdict{font-family:var(--display);font-weight:800;font-size:22px;border-radius:14px;padding:10px 14px;color:#fff}
.verdict.good{background:var(--mint)} .verdict.bad{background:var(--chili)}
html[lang="ar"] .verdict{font-family:var(--arabic)}
.qwrong{margin:0;font-size:15.5px;font-weight:700;line-height:1.4;color:#B3261E}
.qwhy{background:var(--paper);border:2px solid var(--sun);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;font-weight:600}
.qwhy b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#8a6a10;margin-bottom:2px}
.qnext{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qnext span{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.qnext span i{font-style:normal;font-family:var(--display);font-size:22px;background:var(--pepper);color:var(--sun);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;animation:tic 1s steps(2) infinite}
@keyframes tic{50%{transform:rotate(-12deg) scale(1.08)}}
.qnext button{background:var(--pepper);color:var(--sun);font-weight:800;padding:10px 14px}
.credit{margin:2px 0 0;font-size:11.5px;font-weight:600;color:rgba(255,248,230,.6);text-align:center;line-height:1.4}
.credit b{color:var(--sun);font-weight:800}
.tn{display:inline-block;width:19px;height:13px;vertical-align:-2px;margin-inline-start:6px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.brand .tn{width:16px;height:11px;vertical-align:-1px;margin-inline-start:5px}
.prize{margin:0;background:rgba(255,194,68,.14);border:1.5px dashed var(--sun);color:var(--sun);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<div class="app" id="app">

مي · طاهي البيتزا"}, {"key": "from_phone", "when": "Nom de l'expéditeur : téléphone", "fr": "Téléphone", "en": "Phone", "ar": "الهاتف"}, {"key": "from_support", "when": "Nom de l'expéditeur : support Glovo", "fr": "Support Glovo · 31 365 918", "en": "Glovo support · 31 365 918", "ar": "دعم Glovo · 31 365 918"}, {"key": "pizza_marg", "when": "Nom de pizza", "fr": "Margherita", "en": "Margherita", "ar": "مارغريتا"}, {"key": "pizza_thon", "when": "Nom de pizza", "fr": "Pizza Thon", "en": "Tuna pizza", "ar": "بيتزا التن"}, {"key": "pizza_merg", "when": "Nom de pizza", "fr": "Pizza Merguez", "en": "Merguez pizza", "ar": "بيتزا المرقاز"}, {"key": "pizza_vege", "when": "Nom de pizza", "fr": "Végétarienne", "en": "Veggie pizza", "ar": "بيتزا الخضر"}, {"key": "ing_sauce", "when": "Nom d'ingrédient", "fr": "sauce tomate", "en": "tomato sauce", "ar": "صلصة الطماطم"}, {"key": "ing_fromage", "when": "Nom d'ingrédient", "fr": "mozzarella", "en": "mozzarella", "ar": "الموزاريلا"}, {"key": "ing_thon", "when": "Nom d'ingrédient", "fr": "thon", "en": "tuna", "ar": "التن"}, {"key": "ing_merguez", "when": "Nom d'ingrédient", "fr": "merguez", "en": "merguez", "ar": "المرقاز"}, {"key": "ing_legumes", "when": "Nom d'ingrédient", "fr": "légumes", "en": "vegetables", "ar": "الخضر"}, {"key": "welcome", "when": "Début de partie (carte)", "fr": "Bonsoir ! Acceptez les tickets, préparez, enfournez, servez. Je vous écris si quelque chose se passe.", "en": "Good evening! Accept the tickets, prepare, bake and serve. I'll message you if anything happens.", "ar": "مساء الخير! اقبل الطلبات، حضّر، اخبز ثم قدّم. سأراسلك إذا حدث أي شيء."}, {"key": "intro_closed", "when": "Début : restaurant fermé (carte, bouton « Ouvrir la porte »)", "fr": "18:30. Votre pizzeria est encore fermée. Le service sur Glovo commence à 19:00 : ouvrez la porte et préparez-vous.", "en": "6:30 pm. Your pizzeria is still closed. Service on Glovo starts at 7:00 pm: open the door and get ready.", "ar": "الساعة 18:30. مطعمك ما زال مغلقًا. تبدأ الخدمة على Glovo على الساعة 19:00: افتح الباب واستعد."}, {"key": "intro_no_merguez", "when": "Mise en place : le chef découvre qu'il n'a pas de merguez (carte)", "fr": "Chef, on n'a pas de merguez aujourd'hui ! Ce soir, pas de pizza merguez.", "en": "Boss, we have no merguez today! No merguez pizza tonight.", "ar": "يا معلم، لا يوجد مرقاز اليوم! لا بيتزا مرقاز هذه الليلة."}, {"key": "intro_tablet_beep", "when": "La tablette sonne à l'heure d'ouverture (carte)", "fr": "BIP BIP ! Il est 19:00, c'est votre heure d'ouverture sur Glovo. Touchez la tablette.", "en": "BEEP BEEP! It's 7:00 pm, your opening time on Glovo. Tap the tablet.", "ar": "بيب بيب! إنها الساعة 19:00، وقت افتتاحك على Glovo. المس الجهاز اللوحي."}, {"key": "intro_menu_hint", "when": "Texte sur la tablette avant l'ouverture", "fr": "Avant d'ouvrir : désactivez dans le menu tout ce que vous n'avez pas en cuisine.", "en": "Before opening: switch off on the menu everything you don't have in the kitchen.", "ar": "قبل الافتتاح: أوقف في القائمة كل ما لا يتوفر في مطبخك."}, {"key": "intro_merguez_off", "when": "Le joueur désactive la pizza merguez (carte du chef)", "fr": "Bien : j'ai fermé la pizza merguez. Les clients ne peuvent plus la commander, donc pas de commande annulée ni de mauvaise expérience client.", "en": "Good: I switched off the merguez pizza. Customers can't order it, so no cancelled order and no bad customer experience.", "ar": "جيد: أوقفت بيتزا المرقاز. لا يمكن للزبائن طلبها، إذن لا طلبات ملغاة ولا تجربة سيئة للزبون."}, {"key": "intro_opened", "when": "Le magasin est ouvert sur l'app (carte)", "fr": "Votre pizzeria est en ligne ! Les premières commandes arrivent doucement, puis le rush monte. Suivez le cercle jaune pour vos premières commandes.", "en": "Your pizzeria is live! The first orders come in slowly, then the rush builds. Follow the yellow circle for your first orders.", "ar": "مطعمك متصل الآن! تصل الطلبات الأولى ببطء ثم يشتد الضغط. اتبع الدائرة الصفراء في طلباتك الأولى."}, {"key": "pickup_check", "when": "Première commande remise au coursier (carte)", "fr": "Première commande remise ! Vous êtes responsable de la remise : donnez la commande uniquement au coursier Glovo de cette commande, et vérifiez qu'il confirme la récupération dans son app avant de partir.", "en": "First order handed over! You are responsible for the handover: give the order only to the Glovo courier for that order, and check they confirm the pickup in their app before leaving.", "ar": "أول طلب تم تسليمه! أنت مسؤول عن التسليم: سلّم الطلب فقط لعامل توصيل Glovo الخاص به، وتأكد من أنه يؤكد الاستلام في تطبيقه قبل المغادرة."}, {"key": "nobag_decision", "when": "Coursier sans sac Glovo (carte à choix) · {id}", "fr": "Le coursier de la commande #{id} arrive sans sac Glovo. Vous ne pouvez pas vérifier qu'il travaille avec Glovo, et la commande risque d'arriver froide ou abîmée. Que faites-vous ?", "en": "The courier for order #{id} has no Glovo bag. You can't check they work with Glovo, and the order may arrive cold or damaged. What do you do?", "ar": "عامل التوصيل للطلب رقم {id} وصل دون حقيبة Glovo. لا يمكنك التأكد من أنه يعمل مع Glovo، وقد يصل الطلب باردًا أو تالفًا. ماذا تفعل؟"}, {"key": "nobag_called", "when": "Le joueur appelle le support pour le coursier sans sac", "fr": "Merci de nous avoir appelés ! Nous vérifions ce coursier et envoyons un coursier équipé pour votre commande.", "en": "Thanks for calling! We're checking this courier and sending an equipped courier for your order.", "ar": "شكرًا على اتصالك! نحن نتحقق من هذا العامل وسنرسل عامل توصيل مجهزًا لطلبك."}, {"key": "nobag_given", "when": "Le joueur remet la commande sans sac (carte)", "fr": "Commande remise sans sac Glovo : risque de fraude et de commande abîmée, et c'est votre restaurant que le client va noter. Dans ce cas, appelez toujours le 31 365 918.", "en": "Order handed over without a Glovo bag: risk of fraud and a damaged order, and it's your restaurant the customer will rate. In this case, always call 31 365 918.", "ar": "تم تسليم الطلب دون حقيبة Glovo: خطر احتيال وطلب تالف، والزبون سيقيّم مطعمك أنت. في هذه الحالة اتصل دائمًا بالرقم 31 365 918."}, {"key": "noshow_decision", "when": "Commande prête mais aucun coursier (carte à choix) · {id}", "fr": "La commande #{id} est prête au comptoir depuis un moment, mais aucun coursier n'est arrivé. Que faites-vous ?", "en": "Order #{id} has been ready at the counter for a while, but no courier has arrived. What do you do?", "ar": "الطلب رقم {id} جاهز على المنضدة منذ مدة، لكن لم يصل أي عامل توصيل. ماذا تفعل؟"}, {"key": "noshow_called", "when": "Le joueur appelle le support pour un coursier absent · {id}", "fr": "Merci de nous avoir prévenus. Nous réassignons la commande #{id} : un coursier arrive.", "en": "Thanks for letting us know. We're reassigning order #{id}: a courier is on the way.", "ar": "شكرًا لإبلاغنا. نعيد تعيين الطلب رقم {id}: عامل توصيل في الطريق."}, {"key": "noshow_waited", "when": "Le joueur attend encore · {id}", "fr": "Toujours personne pour la commande #{id}, et elle refroidit. Le support (31 365 918) peut réassigner un coursier en quelques minutes.", "en": "Still nobody for order #{id}, and it's getting cold. Support (31 365 918) can reassign a courier in a few minutes.", "ar": "ما زال لا أحد للطلب رقم {id}، وهو يبرد. يمكن للدعم (31 365 918) إعادة تعيين عامل توصيل في دقائق."}, {"key": "overload", "when": "Trop de tickets ouverts : conseil « Forte demande » (carte la 1re fois)", "fr": "Beaucoup de commandes en même temps ! Sur la tablette, activez « Forte demande 30 min » : plus de nouvelles commandes pendant 30 min, sans pénalité. C'est bien mieux que d'annuler.", "en": "Lots of orders at once! On the tablet, turn on \"High demand 30 min\": no new orders for 30 min, with no penalty. Much better than cancelling.", "ar": "طلبات كثيرة في نفس الوقت! من الجهاز اللوحي فعّل «ضغط كبير 30 دقيقة»: لا طلبات جديدة لمدة 30 دقيقة ودون عقوبة. أفضل بكثير من الإلغاء."}, {"key": "emergency", "when": "Appel d'urgence en fin de soirée (carte)", "fr": "Votre téléphone sonne : urgence familiale, vous devez partir maintenant. Avant de partir, allez sur la tablette et fermez le magasin pour le reste de la journée.", "en": "Your phone rings: a family emergency, you have to leave now. Before you go, go to the tablet and close the store for the rest of the day.", "ar": "هاتفك يرنّ: حالة طارئة عائلية، يجب أن تغادر الآن. قبل المغادرة، اذهب إلى الجهاز اللوحي وأغلق المتجر لبقية اليوم."}, {"key": "closed_good", "when": "Le joueur ferme pour la journée (carte)", "fr": "Magasin fermé pour aujourd'hui. Les clients ne voient plus votre pizzeria « ouverte » alors que personne n'est en cuisine : aucune commande annulée.", "en": "Store closed for today. Customers no longer see your pizzeria as open while nobody is in the kitchen: no cancelled orders.", "ar": "تم إغلاق المتجر لبقية اليوم. لم يعد الزبائن يرون مطعمك مفتوحًا بينما لا أحد في المطبخ: لا طلبات ملغاة."}, {"key": "left_open", "when": "Le joueur n'a pas fermé à temps (carte) · {n}", "fr": "Vous êtes parti sans fermer la tablette : votre pizzeria est restée « ouverte » sans personne en cuisine, et {n} commande(s) ont été annulées.", "en": "You left without closing the tablet: your pizzeria stayed open with nobody in the kitchen, and {n} order(s) were cancelled.", "ar": "غادرت دون إغلاق الجهاز اللوحي: بقي مطعمك مفتوحًا دون أحد في المطبخ، وأُلغي {n} طلب."}, {"key": "rain_start", "when": "Début de la pluie : forte demande (carte)", "fr": "Il pleut sur Tunis ! Tout le monde commande en livraison : c'est la forte demande. Si vous êtes débordé, utilisez « Forte demande 30 min » sur la tablette.", "en": "It's raining in Tunis! Everyone is ordering delivery: demand is high. If you're overwhelmed, use \"High demand 30 min\" on the tablet.", "ar": "إنها تمطر في تونس! الجميع يطلب التوصيل: الطلب مرتفع جدًا. إذا كنت تحت الضغط، استخدم «ضغط كبير 30 دقيقة» من الجهاز اللوحي."}, {"key": "rain_end", "when": "Fin de la pluie", "fr": "La pluie se calme. Le rush retombe un peu.", "en": "The rain is easing off. The rush slows down a little.", "ar": "هدأ المطر. خفّ الضغط قليلًا."}, {"key": "stockout", "when": "Rupture d'ingrédient (carte) · {ing} {pizza}", "fr": "Plus de {ing} ! Allez sur la tablette désactiver « {pizza} » avant que les commandes arrivent.", "en": "We're out of {ing}! Go to the tablet and switch off \"{pizza}\" before orders come in.", "ar": "نفدت كمية {ing}! اذهب إلى الجهاز اللوحي وأوقف «{pizza}» قبل وصول الطلبات."}, {"key": "restock", "when": "Retour du fournisseur · {ing} {pizza}", "fr": "Livraison fournisseur : {ing} de retour. Pensez à réactiver « {pizza} ».", "en": "Supplier delivery: {ing} is back. Remember to switch \"{pizza}\" back on.", "ar": "وصل المورّد: {ing} متوفر من جديد. لا تنسَ إعادة تفعيل «{pizza}»."}, {"key": "offline", "when": "Coupure de connexion (carte)", "fr": "Connexion perdue : votre pizzeria apparaît fermée sur l'app. Allez à la tablette pour vous reconnecter.", "en": "Connection lost: your pizzeria shows as closed in the app. Go to the tablet to reconnect.", "ar": "انقطع الاتصال: مطعمك يظهر مغلقًا على التطبيق. اذهب إلى الجهاز اللوحي لإعادة الاتصال."}, {"key": "reconnected", "when": "Après reconnexion", "fr": "Reconnecté. Chaque minute hors ligne fait baisser votre uptime et votre visibilité dans l'app.", "en": "Reconnected. Every minute offline lowers your uptime and your visibility in the app.", "ar": "تمت إعادة الاتصال. كل دقيقة دون اتصال تخفض نسبة التوفر وظهورك في التطبيق."}, {"key": "busy_on", "when": "Mode Occupé activé", "fr": "Forte demande activée pour 30 min : plus de nouvelles commandes, sans pénalité. Bien mieux que d'annuler.", "en": "High demand on for 30 min: no new orders, with no penalty. Much better than cancelling.", "ar": "تم تفعيل «ضغط كبير» لمدة 30 دقيقة: لا طلبات جديدة ودون عقوبة. أفضل بكثير من الإلغاء."}, {"key": "deactivated_good", "when": "Pizza désactivée pendant une rupture · {pizza}", "fr": "Bon réflexe : « {pizza} » désactivée pendant la rupture. Aucune commande impossible à servir.", "en": "Good call: \"{pizza}\" is off during the shortage. No orders you can't serve.", "ar": "تصرّف جيد: تم إيقاف «{pizza}» أثناء النفاد. لن تصلك طلبات لا يمكنك تلبيتها."}, {"key": "saved_sale", "when": "Vente sauvée par appel au client · {pizza}", "fr": "Vente sauvée : le client accepte une {pizza} à la place.", "en": "Sale saved: the customer accepts a {pizza} instead.", "ar": "تم إنقاذ البيع: قبل الزبون {pizza} بدلًا منها."}, {"key": "cancel_stock_manual", "when": "Le joueur annule un ticket en rupture", "fr": "Commande annulée pour rupture. Le client avait déjà payé : désactivez l'article sur la tablette dès qu'il manque.", "en": "Order cancelled because of a missing item. The customer had already paid: switch the item off on the tablet as soon as it runs out.", "ar": "أُلغي الطلب بسبب نفاد منتج. كان الزبون قد دفع مسبقًا: أوقف المنتج على الجهاز اللوحي فور نفاده."}, {"key": "cancel_stock_auto", "when": "Ticket en rupture expiré", "fr": "Commande annulée : l'article en rupture était toujours actif dans votre menu.", "en": "Order cancelled: the out-of-stock item was still active on your menu.", "ar": "أُلغي الطلب: المنتج النافد كان لا يزال مفعّلًا في قائمتك."}, {"key": "expired", "when": "Ticket non accepté à temps (carte la 1re fois)", "fr": "Un ticket a expiré : une commande non acceptée compte comme une annulation. Débordé ? Activez « Forte demande 30 min » sur la tablette.", "en": "A ticket expired: an order you don't accept counts as a cancellation. Overwhelmed? Turn on \"High demand 30 min\" on the tablet.", "ar": "انتهت مهلة طلب: الطلب غير المقبول يُحتسب إلغاءً. تحت الضغط؟ فعّل «ضغط كبير 30 دقيقة» من الجهاز اللوحي."}, {"key": "courier_wait", "when": "Coursier qui attend trop (carte la 1re fois) · {id}", "fr": "Le coursier de la commande #{id} attend devant le comptoir. Une attente évitable fait baisser votre classement.", "en": "The courier for order #{id} is waiting at the counter. Avoidable waiting lowers your ranking.", "ar": "عامل التوصيل للطلب رقم {id} ينتظر أمام المنضدة. الانتظار الذي يمكن تفاديه يخفض ترتيبك."}, {"key": "courier_gaveup", "when": "Client qui annule après une trop longue attente · {id}", "fr": "Commande #{id} annulée : le client a attendu trop longtemps.", "en": "Order #{id} cancelled: the customer waited too long.", "ar": "أُلغي الطلب رقم {id}: انتظر الزبون طويلًا."}, {"key": "complaint_wrong", "when": "Réclamation : mauvaise garniture (carte la 1re fois) · {id}", "fr": "Réclamation client #{id} : les garnitures ne correspondent pas au ticket. Les réclamations font baisser votre Partner Score.", "en": "Customer complaint #{id}: the toppings don't match the ticket. Complaints lower your Partner Score.", "ar": "شكوى الزبون رقم {id}: المكونات لا تطابق الطلب. الشكاوى تخفض Partner Score."}, {"key": "complaint_raw", "when": "Réclamation : pizza crue (carte la 1re fois) · {id}", "fr": "Réclamation client #{id} : la pizza était crue. Sortez-la quand l'anneau devient vert.", "en": "Customer complaint #{id}: the pizza was raw. Take it out when the ring turns green.", "ar": "شكوى الزبون رقم {id}: البيتزا لم تكن مطهوة. أخرجها عندما تصبح الحلقة خضراء."}, {"key": "complaint_burnt", "when": "Réclamation : pizza brûlée (carte la 1re fois) · {id}", "fr": "Réclamation client #{id} : la pizza était brûlée. Le client paie, attend, et reçoit une pizza immangeable : il note votre restaurant. Vérifiez chaque pizza sur la passe avant de la remettre au coursier.", "en": "Customer complaint #{id}: the pizza was burnt. The customer paid, waited and got an inedible pizza: they rate your restaurant. Check every pizza on the pass before handing it to the courier.", "ar": "شكوى الزبون رقم {id}: البيتزا كانت محترقة. دفع الزبون وانتظر ثم تلقى بيتزا لا تؤكل: سيقيّم مطعمك. تحقق من كل بيتزا على منضدة التمرير قبل تسليمها."}, {"key": "kitchen_stockout", "when": "Le pizzaiolo n'a plus un ingrédient pour une commande acceptée (carte la 1re fois) · {id} {ing}", "fr": "Plus de {ing} pour la commande #{id} ! Appelez le client pour lui proposer une autre pizza, et désactivez la pizza concernée sur la tablette.", "en": "No more {ing} for order #{id}! Call the customer to offer another pizza, and switch that pizza off on the tablet.", "ar": "نفد {ing} للطلب رقم {id}! اتصل بالزبون لتقترح عليه بيتزا أخرى، وأوقف البيتزا المعنية من الجهاز اللوحي."}, {"key": "ads_nudge", "when": "Conseil de l'AM pour utiliser Promo / Ads · {ps}", "fr": "Votre Partner Score est à {ps}. Quand la cuisine suit, c'est le moment : touchez « Promo » ou « Glovo Ads » au-dessus de la cuisine pour recevoir plus de commandes.", "en": "Your Partner Score is {ps}. When the kitchen keeps up, it's the right time: tap \"Promo\" or \"Glovo Ads\" above the kitchen to get more orders.", "ar": "Partner Score الخاص بك هو {ps}. عندما يواكب المطبخ، هذا هو الوقت المناسب: المس «عرض» أو «Glovo Ads» فوق المطبخ لتحصل على طلبات أكثر."}, {"key": "promo_on", "when": "Promo lancée · {pct} {s}", "fr": "Promo -{pct} % lancée : votre pizzeria apparaît dans « Promotions » et les commandes augmentent. Chaque commande promo rapporte un peu moins.", "en": "-{pct}% promo is live: your pizzeria shows in \"Promotions\" and orders go up. Each promo order earns a bit less.", "ar": "تم إطلاق عرض -{pct}%: يظهر مطعمك في «العروض» وتزداد الطلبات. كل طلب بالعرض يدرّ أقل قليلًا."}, {"key": "ads_low_warn", "when": "Ads lancées avec un Partner Score faible (carte la 1re fois) · {ps}", "fr": "Attention : Glovo Ads lancé avec un Partner Score de {ps}. Avec des opérations fragiles, vous payez de la visibilité pour des commandes qui risquent d'être annulées.", "en": "Careful: Glovo Ads launched with a Partner Score of {ps}. With shaky operations, you pay for visibility on orders that may get cancelled.", "ar": "انتبه: أُطلق Glovo Ads بنتيجة Partner Score تبلغ {ps}. مع عمليات غير مستقرة، تدفع مقابل ظهور لطلبات قد تُلغى."}, {"key": "ads_title", "when": "Titre de la proposition Ads", "fr": "On lance Glovo Ads pour la fin de soirée ?", "en": "Shall we launch Glovo Ads for the rest of the evening?", "ar": "هل نطلق Glovo Ads لبقية السهرة؟"}, {"key": "ads_text", "when": "Texte de la proposition Ads · {cost} {ps}", "fr": "Budget : {cost} TND. Votre Partner Score actuel est de {ps}. Plus il est haut, plus vos annonces rapportent de commandes.", "en": "Budget: {cost} TND. Your current Partner Score is {ps}. The higher it is, the more orders your ads bring.", "ar": "الميزانية: {cost} دينار. Partner Score الحالي هو {ps}. كلما كان أعلى، جلبت إعلاناتك طلبات أكثر."}, {"key": "ads_on", "when": "Ads lancées · {cost} {s}", "fr": "Glovo Ads lancé ({cost} TND). Les tickets marqués « Ads » viennent de votre campagne : plus votre Partner Score est haut, plus elle rapporte.", "en": "Glovo Ads is live ({cost} TND). Tickets marked \"Ads\" come from your campaign: the higher your Partner Score, the more it brings.", "ar": "تم إطلاق Glovo Ads ({cost} دينار). الطلبات التي تحمل علامة «Ads» مصدرها حملتك: كلما ارتفع Partner Score، جلبت أكثر."}, {"key": "tip_uptime", "when": "Conseil final : uptime < 95 % · {uptime} {min}", "fr": "Uptime {uptime} % : pizzeria invisible {min} min. Visez au moins 95 % : vérifiez la tablette à chaque ouverture.", "en": "Uptime {uptime}%: your pizzeria was invisible for {min} min. Aim for at least 95%: check the tablet every time you open.", "ar": "نسبة التوفر {uptime}%: كان مطعمك غير ظاهر لمدة {min} دقيقة. استهدف 95% على الأقل: تحقق من الجهاز اللوحي عند كل افتتاح."}, {"key": "tip_stock", "when": "Conseil final : annulations pour rupture · {n}", "fr": "{n} annulation(s) pour rupture : désactivez l'article dès qu'il manque, ou appelez le client pour sauver la vente.", "en": "{n} cancellation(s) for missing items: switch the item off as soon as it runs out, or call the customer to save the sale.", "ar": "{n} إلغاء بسبب النفاد: أوقف المنتج فور نفاده، أو اتصل بالزبون لإنقاذ البيع."}, {"key": "tip_missed", "when": "Conseil final : tickets expirés · {n}", "fr": "{n} ticket(s) expiré(s) : une commande non acceptée est une o_ads", "when": "Conseil final : bon score mais pas d'Ads", "fr": "Opérations solides, pas d'Ads : avec ce score, une campagne aurait rapporté des commandes en plus. Parlez-en à votre AM.", "en": "Solid operations, no Ads: with this score, a campaign would have brought extra orders. Talk to your AM.", "ar": "عمليات قوية دون إعلانات: بهذه النتيجة كانت الحملة ستجلب طلبات إضافية. تحدّث مع مسؤول حسابك."}, {"key": "tip_saved", "when": "Conseil final : ventes sauvées · {n}", "fr": "{n} vente(s) sauvée(s) en appelant le client : excellent réflexe.", "en": "{n} sale(s) saved by calling the customer: great reflex.", "ar": "{n} بيع تم إنقاذه بالاتصال بالزبون: تصرّف ممتاز."}, {"key": "tip_support", "when": "Conseil final : le joueur a appelé le support · {n}", "fr": "{n} appel(s) au support 31 365 918 : bon réflexe. Coursier sans sac ou qui ne vient pas, le support règle le problème vite.", "en": "{n} call(s) to support on 31 365 918: good reflex. Courier without a bag or not showing up, support fixes it fast.", "ar": "{n} اتصال بالدعم 31 365 918: تصرّف جيد. عامل دون حقيبة أو لم يحضر؟ الدعم يحل المشكلة بسرعة."}, {"key": "tip_nobag", "when": "Conseil final : commande remise sans sac", "fr": "Commande remise à un coursier sans sac Glovo : la prochaine fois, ne remettez rien et appelez le 31 365 918.", "en": "Order handed to a courier without a Glovo bag: next time, hand nothing over and call 31 365 918.", "ar": "سلّمت طلبًا لعامل دون حقيبة Glovo: في المرة القادمة لا تسلّم شيئًا واتصل بالرقم 31 365 918."}, {"key": "tip_left_open", "when": "Conseil final : parti sans fermer · {n}", "fr": "Fermeture oubliée : {n} commande(s) annulée(s). Si vous devez fermer plus tôt, utilisez « Fermer pour aujourd'hui » sur la tablette.", "en": "Forgot to close: {n} order(s) cancelled. If you have to close early, use \"Close for the day\" on the tablet.", "ar": "نسيت الإغلاق: أُلغي {n} طلب. إذا اضطررت للإغلاق مبكرًا، استخدم «إغلاق لبقية اليوم» من الجهاز اللوحي."}, {"key": "tip_closed_good", "when": "Conseil final : fermeture d'urgence bien faite", "fr": "Fermeture d'urgence bien gérée : « Fermer pour aujourd'hui » évite les annulations quand personne n'est en cuisine.", "en": "Emergency closing done right: \"Close for the day\" avoids cancellations when nobody is in the kitchen.", "ar": "إغلاق طارئ ممتاز: «إغلاق لبقية اليوم» يجنّبك الإلغاءات عندما لا يكون أحد في المطبخ."}, {"key": "tip_busy", "when": "Conseil final : rush sans « Forte demande » · {n}", "fr": "Rush difficile : {n} commande(s) perdue(s) pendant la forte demande. « Forte demande 30 min » vous laisse le temps de rattraper sans pénalité.", "en": "Tough rush: {n} order(s) lost during high demand. \"High demand 30 min\" gives you time to catch up with no penalty.", "ar": "ذروة صعبة: ضاع {n} طلب أثناء الضغط الكبير. «ضغط كبير 30 دقيقة» يمنحك الوقت للّحاق دون عقوبة."}, {"key": "tip_promo", "when": "Conseil final : commandes promo · {n} {pct}", "fr": "{n} commande(s) promo : la promo attire du monde, mais chaque commande rapporte {pct} % de moins. Gardez-la pour les heures creuses et les nouveaux clients.", "en": "{n} promo order(s): promos bring people in, but each order earns {pct}% less. Keep them for quiet hours and new customers.", "ar": "{n} طلب بالعرض: العروض تجذب الزبائن لكن كل طلب يدرّ أقل بنسبة {pct}%. احتفظ بها للأوقات الهادئة وللزبائن الجدد."}, {"key": "tip_perfect", "when": "Conseil final : aucune erreur", "fr": "Service parfait : gardez ces réflexes pour l'hiver et le rush de l'Iftar.", "en": "Perfect service: keep these habits for winter and the Iftar rush.", "ar": "خدمة مثالية: حافظ على هذه العادات في الشتاء وفي ذروة الإفطار."}, {"key": "train_menu_title", "when": "Formation · titre du menu", "fr": "Mode formation", "en": "Training mode", "ar": "وضع التدريب"}, {"key": "train_menu_text", "when": "Formation · texte du menu", "fr": "Un scénario à la fois, sans chrono ni score. Idéal pour revoir chaque réflexe de la présentation.", "en": "One scenario at a time, no timer and no score. Ideal Call 31 365 918: support reassigns a courier.", "ar": "تذكّر: الطلب الجاهز الذي ينتظر يبرد ويخفض تقييمك. اتصل بالرقم 31 365 918: الدعم يعيد تعيين عامل توصيل."}, {"key": "train_burnt_title", "when": "Formation 6 · titre", "fr": "Pizza brûlée", "en": "Burnt pizza", "ar": "بيتزا محترقة"}, {"key": "train_burnt_goal", "when": "Formation 6 · objectif", "fr": "Une pizza sort brûlée du four. Vous êtes le dernier contrôle avant le client.", "en": "A pizza comes out of the oven burnt. You are the last check before the customer.", "ar": "تخرج بيتزا محترقة من الفرن. أنت آخر نقطة تحقق قبل الزبون."}, {"key": "train_burnt_s1", "when": "Formation 6 · étape 1", "fr": "Acceptez la commande.", "en": "Accept the order.", "ar": "اقبل الطلب."}, {"key": "train_burnt_s2", "when": "Formation 6 · étape 2", "fr": "Attendez la pizza sur la passe et regardez-la bien.", "en": "Wait for the pizza on the pass and look at it carefully.", "ar": "انتظر البيتزا على منضدة التمرير وانظر إليها جيدًا."}, {"key": "train_burnt_s3", "when": "Formation 6 · étape 3", "fr": "Touchez la passe et choisissez quoi faire.", "en": "Tap the pass and choose what to do.", "ar": "المس منضدة التمرير واختر ما تفعله."}, {"key": "train_burnt_recap", "when": "Formation 6 · à retenir", "fr": "À retenir : vérifiez chaque commande avant de la remettre. Une pizza ratée se refait : mieux vaut quelques minutes de plus qu'une réclamation et une mauvaise note.", "en": "Remember: check every order before handing it over. A failed pizza gets remade: a few extra minutes beat a complaint and a bad rating.", "ar": "تذكّر: تحقق من كل طلب قبل تسليمه. البيتزا الفاشلة تُعاد: دقائق إضافية أفضل من شكوى وتقييم سيئ."}, {"key": "train_rush_title", "when": "Formation 7 · titre", "fr": "Rush et « Forte demande »", "en": "Rush and \"High demand\"", "ar": "الذروة و«ضغط كبير»"}, {"key": "train_rush_goal", "when": "Formation 7 · objectif", "fr": "Beaucoup de commandes d'un coup : la cuisine ne suit plus.", "en": "Lots of orders at once: the kitchen can't keep up.", "ar": "طلبات كثيرة دفعة واحدة: المطبخ لا يواكب."}, {"key": "train_rush_s1", "when": "Formation 7 · étape 1", "fr": "Acceptez les commandes qui arrivent.", "en": "Accept the incoming orders.", "ar": "اقبل الطلبات الواردة."}, {"key": "train_rush_s2", "when": "Formation 7 · étape 2", "fr": "Votre cuisine est débordée : touchez la tablette.", "en": "Your kitchen is overwhelmed: tap the tablet.", "ar": "مطبخك تحت الضغط: المس الجهاز اللوحي."}, {"key": "train_rush_s3", "when": "Formation 7 · étape 3", "fr": "Activez « Forte demande · 30 min ».", "en": "Turn on \"High demand · 30 min\".", "ar": "فعّل «ضغط كبير · 30 دقيقة»."}, {"key": "train_rush_recap", "when": "Formation 7 · à retenir", "fr": "À retenir : quand vous êtes débordé, « Forte demande 30 min » met les nouvelles commandes en pause, sans pénalité. Ne laissez jamais expirer une commande et n'annulez pas par manque de temps.", "en": "Remember: when you're overwhelmed, \"High demand 30 min\" pauses new orders with no penalty. Never let an order expire and never cancel for lack of time.", "ar": "تذكّر: عندما تكون تحت الضغط، «ضغط كبير 30 دقيقة» يوقف الطلبات الجديدة دون عقوبة. لا تترك طلبًا تنتهي مهلته ولا تُلغِ بسبب ضيق الوقت."}, {"key": "train_offline_title", "when": "Formation 8 · titre", "fr": "Connexion perdue", "en": "Connection lost", "ar": "انقطاع الاتصال"}, {"key": "train_offline_goal", "when": "Formation 8 · objectif", "fr": "Votre tablette a perdu la connexion : sur l'app, vous apparaissez fermé.", "en": "Your tablet lost its connection: in the app, you look closed.", "ar": "فقد جهازك اللوحي الاتصال: تظهر مغلقًا على التطبيق."}, {"key": "train_offline_s1", "when": "Formation 8 · étape 1", "fr": "Touchez la tablette.", "en": "Tap the tablet.", "ar": "المس الجهاز اللوحي."}, {"key": "train_offline_s2", "when": "Formation 8 · étape 2", "fr": "Touchez « Reconnecter le magasin ».", "en": "Tap \"Reconnect the store\".", "ar": "المس «إعادة توصيل المتجر»."}, {"key": "train_offline_recap", "when": "Formation 8 · à retenir", "fr": "À retenir : chaque minute hors ligne fait baisser votre uptime (objectif ≥ 95 %) et votre visibilité. Vérifiez la tablette à l'ouverture et après chaque coupure.", "en": "Remember: every minute offline lowers your uptime (target ≥ 95%) and your visibility. Check the tablet at opening and after every outage.", "ar": "تذكّر: كل دقيقة دون اتصال تخفض نسبة التوفر (الهدف ≥ 95%) وظهورك. تحقق من الجهاز اللوحي عند الافتتاح وبعد كل انقطاع."}, {"key": "train_camp_title", "when": "Formation 9 · titre", "fr": "Promo et Glovo Ads", "en": "Promo and Glovo Ads", "ar": "العروض وGlovo Ads"}, {"key": "train_camp_goal", "when": "Formation 9 · objectif", "fr": "Votre service tourne bien : c'est le moment d'attirer plus de clients.", "en": "Your service is running well: time to bring in more customers.", "ar": "خدمتك تسير جيدًا: حان وقت جذب زبائن أكثر."}, {"key": "train_camp_s1", "when": "Formation 9 · étape 1", "fr": "Touchez « Promo » au-dessus de la cuisine.", "en": "Tap \"Promo\" above the kitchen.", "ar": "المس «عرض» فوق المطبخ."}, {"key": "train_camp_s2", "when": "Formation 9 · étape 2", "fr": "Les commandes « Promo » arrivent : acceptez-les.", "en": "\"Promo\" orders are coming in: accept them.", "ar": "طلبات «العرض» تصل: اقبلها."}, {"key": "train_camp_s3", "when": "Formation 9 · étape 3", "fr": "Touchez maintenant « Glovo Ads ».", "en": "Now tap \"Glovo Ads\".", "ar": "المس الآن «Glovo Ads»."}, {"key": "train_camp_recap", "when": "Formation 9 · à retenir", "fr": "À retenir : promo et Ads font venir des clients, mais elles rapportent seulement si vos opérations suivent : uptime ≥ 95 %, annulations < 2 %, temps de préparation réaliste. Les opérations d'abord, la visibilité ensuite.", "en": "Remember: promos and Ads bring customers, but they only pay off if your operations keep up: uptime ≥ 95%, cancellations < 2%, realistic prep time. Operations first, visibility second.", "ar": "تذكّر: العروض والإعلانات تجلب الزبائن، لكنها لا تُربح إلا إذا واكبت عملياتك: توفر ≥ 95%، إلغاء < 2%، وقت تحضير واقعي. العمليات أولًا ثم الظهور."}, {"key": "train_close_title", "when": "Formation 10 · titre", "fr": "Fermer en urgence", "en": "Closing in an emergency", "ar": "الإغلاق في حالة طارئة"}, {"key": "train_close_goal", "when": "Formation 10 · objectif", "fr": "Une urgence vous oblige à partir avant l'heure de fermeture.", "en": "An emergency forces you to leave before closing time.", "ar": "حالة طارئة تجبرك على المغادرة قبل وقت الإغلاق."}, {"key": "train_close_s1", "when": "Formation 10 · étape 1", "fr": "Touchez la tablette.", "en": "Tap the tablet.", "ar": "المس الجهاز اللوحي."}, {"key": "train_close_s2", "when": "Formation 10 · étape 2", "fr": "Touchez « Fermer pour aujourd'hui ».", "en": "Tap \"Close for the day\".", "ar": "المس «إغلاق لبقية اليوم»."}, {"key": "train_close_recap", "when": "Formation 10 · à retenir", "fr": "À retenir : si vous fermez plus tôt, utilisez « Fermer pour aujourd'hui ». Sinon votre restaurant reste ouvert sur l'app sans personne en cuisine, et chaque commande sera annulée.", "en": "Remember: if you close early, use \"Close for the day\". Otherwise your restaurant stays open in the app with nobody in the kitchen, and every order gets cancelled.", "ar": "تذكّر: إذا أغلقت مبكرًا، استخدم «إغلاق لبقية اليوم». وإلا يبقى مطعمك مفتوحًا على التطبيق دون أحد في المطبخ وسيُلغى كل طلب."}, {"key": "burnt_decision", "when": "Mode formation : le caissier prend une pizza brûlée sur la passe (carte à choix) · {id}", "fr": "La pizza #{id} est brûlée. Le client va la recevoir et la noter. Que faites-vous ?", "en": "Pizza #{id} is burnt. The customer will receive it and rate it. What do you do?", "ar": "البيتزا رقم {id} محترقة. سيستلمها الزبون ويقيّمها. ماذا تفعل؟"}, {"key": "burnt_remade", "when": "Mode formation : le joueur fait refaire la pizza brûlée", "fr": "Bonne décision : le pizzaiolo refait la pizza. Quelques minutes de plus valent mieux qu'une réclamation.", "en": "Good call: the pizzaiolo remakes the pizza. A few extra minutes beat a complaint.", "ar": "قرار صائب: طاهي البيتزا يعيد تحضيرها. دقائق إضافية أفضل من شكوى."}, {"key": "q_open_scene", "when": "Quiz 1 · open · situation", "fr": "19:00, la tablette sonne : c'est l'heure d'ouvrir sur Glovo. Mais aujourd'hui, pas de merguez en cuisine.", "en": "7 pm, the tablet beeps: time to open on Glovo. But today there's no merguez in the kitchen.", "ar": "الساعة 19:00، الجهاز اللوحي يرنّ: حان وقت الافتتاح على Glovo. لكن اليوم لا يوجد مرقاز في المطبخ."}, {"key": "q_open_q", "when": "Quiz 1 · open · question", "fr": "Que faites-vous avant d'ouvrir ?", "en": "What do you do before opening?", "ar": "ماذا تفعل قبل الافتتاح؟"}, {"key": "q_open_a", "when": "Quiz 1 · open · BONNE réponse", "fr": "Je désactive la pizza merguez sur la tablette, puis j'ouvre", "en": "I switch off the merguez pizza on the tablet, then open", "ar": "أوقف بيتزا المرقاز على الجهاز اللوحي ثم أفتح"}, {"key": "q_open_b", "when": "Quiz 1 · open · mauvaise réponse 1", "fr": "J'ouvre et j'annulerai les commandes merguez", "en": "I open and will cancel merguez orders", "ar": "أفتح وسألغي طلبات المرقاز"}, {"key": "q_open_c", "when": "Quiz 1 · open · mauvaise réponse 2", "fr": "J'ouvre et j'enverrai une autre pizza à la place", "en": "I open and will send another pizza instead", "ar": "أفتح وسأرسل بيتزا أخرى بدلها"}, {"key": "q_open_d", "when": "Quiz 1 · open · mauvaise réponse 3", "fr": "Je reste fermé jusqu'à l'arrivée du fournisseur", "en": "I stay closed until the supplier arrives", "ar": "أبقى مغلقًا حتى يصل المزوّد"}, {"key": "q_open_why", "when": "Quiz 1 · open · bandeau « pourquoi »", "fr": "Ouvrir à l'heure protège votre uptime, et désactiver ce qui manque évite des annulations et des clients déçus.", "en": "Opening on time protects your uptime, and switching off what's missing avoids cancellations and disappointed customers.", "ar": "الافتتاح في الوقت يحمي نسبة التوفر، وإيقاف ما ينقص يتجنب الإلغاءات وخيبة الزبائن."}, {"key": "q_open_wrong", "when": "Quiz 1 · open · message si mauvaise réponse", "fr": "Non ! Dans ce cas, il faut désactiver la pizza merguez sur la tablette, puis ouvrir le magasin à l'heure.", "en": "No! In this case, switch off the merguez pizza on the tablet, then open the store on time.", "ar": "لا! في هذه الحالة، أوقف بيتزا المرقاز على الجهاز اللوحي ثم افتح المتجر في الوقت."}, {"key": "q_stock_scene", "when": "Quiz 2 · stock · situation", "fr": "En plein service, le pizzaiolo crie : « Plus de thon ! »", "en": "Mid-service, the pizzaiolo shouts: \"No more tuna!\"", "ar": "في عز الخدمة، يصرخ طاهي البيتزا: «نفد التن!»"}, {"key": "q_stock_q", "when": "Quiz 2 · stock · question", "fr": "Quelle est la première chose à faire ?", "en": "What's the first thing to do?", "ar": "ما أول شيء تفعله؟"}, {"key": "q_stock_a", "when": "Quiz 2 · stock · BONNE réponse", "fr": "Désactiver la pizza thon sur la tablette tout de suite", "en": "Switch off the tuna pizza on the tablet right away", "ar": "أوقف بيتزا التن على الجهاز اللوحي فورًا"}, {"key": "q_stock_b", "when": "Quiz 2 · stock · mauvaise réponse 1", "fr": "Attendre et annuler les commandes thon qui arrivent", "en": "Wait and cancel the tuna orders that come in", "ar": "أنتظر وألغي طلبات التن التي تصل"}, {"key": "q_stock_c", "when": "Quiz 2 · stock · mauvaise réponse 2", "fr": "Fermer tout le magasin le temps de racheter du thon", "en": "Close the whole store until I buy more tuna", "ar": "أغلق المتجر بالكامل حتى أشتري التن"}, {"key": "q_stock_d", "when": "Quiz 2 · stock · mauvaise réponse 3", "fr": "Appeler mon Account Manager pour qu'il la retire", "en": "Call my Account Manager to remove it", "ar": "أتصل بمسؤول حسابي ليزيلها"}, {"key": "q_stock_why", "when": "Quiz 2 · stock · bandeau « pourquoi »", "fr": "Un article en rupture se désactive en quelques secondes sur la tablette : plus de commande impossible, zéro annulation. Réactivez-le quand le stock revient.", "en": "An out-of-stock item is switched off in seconds on the tablet: no impossible orders, zero cancellations. Switch it back on when stock returns.", "ar": "المنتج النافد يُوقف في ثوانٍ على الجهاز اللوحي: لا طلبات مستحيلة ولا إلغاءات. أعد تفعيله عند عودة المخزون."}, {"key": "q_stock_wrong", "when": "Quiz 2 · stock · message si mauvaise réponse", "fr": "Non ! Dans ce cas, il faut désactiver la pizza thon sur la tablette tout de suite, et la réactiver quand le stock revient.", "en": "No! In this case, switch off the tuna pizza on the tablet right away, and switch it back on when stock returns.", "ar": "لا! في هذه الحالة، أوقف بيتزا التن على الجهاز اللوحي فورًا وأعد تفعيلها عند عودة المخزون."}, {"key": "q_call_scene", "when": "Quiz 3 · call · situation", "fr": "Une commande « Pizza Thon » était arrivée juste avant la rupture.", "en": "A tuna pizza order came in just before you ran out.", "ar": "وصل طلب «بيتزا التن» قبل نفاد التن مباشرة."}, {"key": "q_call_q", "when": "Quiz 3 · call · question", "fr": "Que faites-vous avec cette commande ?", "en": "What do you do with this order?", "ar": "ماذا تفعل بهذا الطلب؟"}, {"key": "q_call_a", "when": "Quiz 3 · call · BONNE réponse", "fr": "J'appelle le client et je lui propose une autre pizza", "en": "I call the customer and offer another pizza", "ar": "أتصل بالزبون وأقترح عليه بيتزا أخرى"}, {"key": "q_call_b", "when": "Quiz 3 · call · mauvaise réponse 1", "fr": "J'annule la commande, le client recommandera", "en": "I cancel the order, the customer will reorder", "ar": "ألغي الطلب، وسيطلب الزبون من جديد"}, {"key": "q_call_c", "when": "Quiz 3 · call · mauvaise réponse 2", "fr": "J'envoie la pizza sans thon, sans prévenir", "en": "I send the pizza without tuna, without telling anyone", "ar": "أرسل البيتزا دون تن ودون إخبار أحد"}, {"key": "q_call_d", "when": "Quiz 3 · call · mauvaise réponse 3", "fr": "Je demande au coursier d'expliquer au client", "en": "I ask the courier to explain to the customer", "ar": "أطلب من عامل التوصيل أن يشرح للزبون"}, {"key": "q_call_why", "when": "Quiz 3 · call · bandeau « pourquoi »", "fr": "Appeler le client sauve la vente et évite une annulation, qui pèse lourd dans votre Partner Score.", "en": "Calling the customer saves the sale and avoids a cancellation, which weighs heavily on your Partner Score.", "ar": "الاتصال بالزبون ينقذ البيع ويتجنب إلغاءً يؤثر كثيرًا في Partner Score."}, {"key": "q_call_wrong", "when": "Quiz 3 · call · message si mauvaise réponse", "fr": "Non ! Dans ce cas, il faut appeler le client et lui proposer une alternative. On n'annule qu'en dernier recours.", "en": "No! In this case, call the customer and offer an alternative. Cancel only as a last resort.", "ar": "لا! في هذه الحالة، اتصل بالزبون واقترح بديلًا. الإلغاء آخر حل."}, {"key": "q_nobag_scene", "when": "Quiz 4 · nobag · situation", "fr": "Un coursier arrive pour récupérer votre commande… sans sac Glovo.", "en": "A courier arrives to pick up your order… without a Glovo bag.", "ar": "يصل عامل توصيل لاستلام طلبك… دون حقيبة Glovo."}, {"key": "q_nobag_q", "when": "Quiz 4 · nobag · question", "fr": "Que faites-vous ?", "en": "What do you do?", "ar": "ماذا تفعل؟"}, {"key": "q_nobag_a", "when": "Quiz 4 · nobag · BONNE réponse", "fr": "J'appelle LiveOps au 31 365 918 avant de remettre quoi que ce soit", "en": "I call LiveOps on 31 365 918 before handing anything over", "ar": "أتصل بـ LiveOps على 31 365 918 قبل تسليم أي شيء"}, {"key": "q_nobag_b", "when": "Quiz 4 · nobag · mauvaise réponse 1", "fr": "Je lui donne la commande, il a le bon numéro de commande", "en": "I give him the order, he has the right order number", "ar": "أسلّمه الطلب، لديه رقم الطلب الصحيح"}, {"key": "q_nobag_c", "when": "Quiz 4 · nobag · mauvaise réponse 2", "fr": "Je vérifie sa carte d'identité et je lui donne la commande", "en": "I check his ID card and give him the order", "ar": "أتحقق من بطاقة هويته وأسلّمه الطلب"}, {"key": "q_nobag_d", "when": "Quiz 4 · nobag · mauvaise réponse 3", "fr": "J'appelle mon Account Manager pour vérifier le coursier", "en": "I call my Account Manager to check the courier", "ar": "أتصل بمسؤول حسابي ليتحقق من العامل"}, {"key": "q_nobag_why", "when": "Quiz 4 · nobag · bandeau « pourquoi »", "fr": "Sans sac Glovo, impossible de vérifier le coursier. LiveOps (31 365 918) le vérifie et envoie un autre coursier si besoin.", "en": "Without a Glovo bag, you can't verify the courier. LiveOps (31 365 918) checks him and sends another courier if needed.", "ar": "دون حقيبة Glovo لا يمكن التحقق من العامل. LiveOps (31 365 918) يتحقق منه ويرسل غيره عند الحاجة."}, {"key": "q_nobag_wrong", "when": "Quiz 4 · nobag · message si mauvaise réponse", "fr": "Non ! Dans ce cas, on ne remet rien : il faut appeler LiveOps au 31 365 918, qui vérifie le coursier.", "en": "No! In this case, hand nothing over: call LiveOps on 31 365 918, who will check the courier.", "ar": "لا! في هذه الحالة لا تسلّم شيئًا: اتصل بـ LiveOps على 31 365 918 ليتحقق من العامل."}, {"key": "q_noshow_scene", "when": "Quiz 5 · noshow · situation", "fr": "La commande est prête au comptoir depuis 15 minutes. Aucun coursier en vue.", "en": "The order has been ready at the counter for 15 minutes. No courier in sight.", "ar": "الطلب جاهز على المنضدة منذ 15 دقيقة. لا يوجد أي عامل توصيل."}, {"key": "q_noshow_q", "when": "Quiz 5 · noshow · question", "fr": "Que faites-vous ?", "en": "What do you do?", "ar": "ماذا تفعل؟"}, {"key": "q_noshow_a", "when": "Quiz 5 · noshow · BONNE réponse", "fr": "J'appelle LiveOps au 31 365 918 pour avoir un coursier", "en": "I call LiveOps on 31 365 918 to get a courier", "ar": "أتصل بـ LiveOps على 31 365 918 للحصول على عامل توصيل"}, {"key": "q_noshow_b", "when": "Quiz 5 · noshow · mauvaise réponse 1", "fr": "J'attends encore, il finira bien par arriver", "en": "I keep waiting, he'll show up eventually", "ar": "أنتظر أكثر، سيصل في النهاية"}, {"key": "q_noshow_c", "when": "Quiz 5 · noshow · mauvaise réponse 2", "fr": "J'annule la commande, elle est déjà froide", "en": "I cancel the order, it's already cold", "ar": "ألغي الطلب، فقد برد"}, {"key": "q_noshow_d", "when": "Quiz 5 · noshow · q_burnt_d", "when": "Quiz 6 · burnt · mauvaise réponse 3", "fr": "J'annule la commande pour ne pas faire attendre", "en": "I cancel the order so nobody waits", "ar": "ألغي الطلب حتى لا ينتظر أحد"}, {"key": "q_burnt_why", "when": "Quiz 6 · burnt · bandeau « pourquoi »", "fr": "Vous êtes le dernier contrôle avant le client. Quelques minutes de plus coûtent moins cher qu'une réclamation, un remboursement et une mauvaise note.", "en": "You are the last check before the customer. A few extra minutes cost less than a complaint, a refund and a bad rating.", "ar": "أنت آخر نقطة تحقق قبل الزبون. دقائق إضافية أقل كلفة من شكوى واسترداد وتقييم سيئ."}, {"key": "q_burnt_wrong", "when": "Quiz 6 · burnt · message si mauvaise réponse", "fr": "Non ! Dans ce cas, il faut refaire la pizza : une pizza brûlée, c'est une réclamation et un remboursement assurés.", "en": "No! In this case, remake the pizza: a burnt pizza means a sure complaint and refund.", "ar": "لا! في هذه الحالة أعد تحضير البيتزا: البيتزا المحترقة تعني شكوى واستردادًا مؤكدين."}, {"key": "q_dispute_scene", "when": "Quiz 7 · dispute · situation", "fr": "Un client dit que sa pizza est arrivée brûlée. Il ouvre une réclamation pour être remboursé.", "en": "A customer says their pizza arrived burnt. They open a claim to get refunded.", "ar": "يقول زبون إن البيتزا وصلت محترقة، ويفتح شكوى لاسترداد المبلغ."}, {"key": "q_dispute_q", "when": "Quiz 7 · dispute · question", "fr": "Que faites-vous ?", "en": "What do you do?", "ar": "ماذا تفعل؟"}, {"key": "q_dispute_a", "when": "Quiz 7 · dispute · BONNE réponse", "fr": "Je traite la réclamation sur le Manager Portal : excuses ou contestation avec preuve", "en": "I handle the claim in the Manager Portal: apologise, or dispute it with proof", "ar": "أعالج الشكوى على Manager Portal: أعتذر أو أعترض بدليل"}, {"key": "q_dispute_b", "when": "Quiz 7 · dispute · mauvaise réponse 1", "fr": "J'appelle LiveOps (31 365 918) pour qu'ils annulent le remboursement", "en": "I call LiveOps (31 365 918) }

/* ================= backend =================
   1) Inside Google Apps Script    -> google.script.run
   2) Elsewhere with ENDPOINT set  -> fetch to the Apps Script web app (?api=config, ?api=board, POST)
   3) Neither                      -> demo mode (defaults, leaderboard on this device only)             */
const ENDPOINT = (window.RUSH_ENDPOINT || "").trim();
if(+window.RUSH_BOTTOM_SPACE > 0) document.documentElement.style.setProperty("--host-gap", (+window.RUSH_BOTTOM_SPACE) + "px");   // set in config.js when the game is hosted on Netlify / GitHub Pages
const GS = (typeof google !== "undefined" && google.script && google.script.run) ? google.script.run : null;
const gs = (fn, arg) => new Promise((res, rej) => { GS.withSuccessHandler(res).withFailureHandler(rej)[fn](arg); });
let mem = []; const LS = "rushglovo.pizza.v3";
let DEVICE = ""; try { DEVICE = localStorage.getItem("rushglovo.device") || ""; if(!DEVICE){ DEVICE = Math.random().toString(36).slice(2, 12); localStorage.setItem("rushglovo.device", DEVICE); } } catch(e){ DEVICE = Math.random().toString(36).slice(2, 12); }
const CODE_AB = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const localCode = () => Array.from({length:4}, () => CODE_AB[Math.floor(Math.random() * CODE_AB.length)]).join("");
const loc = { read(){ try { const v = localStorage.getItem(LS); if(v) return JSON.parse(v); } catch(e){} return mem.slice(); },
              write(a){ mem = a.slice(); try { localStorage.setItem(LS, JSON.stringify(a)); } catch(e){} } };
const better = (p, q) => p.points !== q.points ? p.points > q.points : (p.answerMs || 1e12) < (q.answerMs || 1e12);
const bestOf = a => { const m = new Map(); a.forEach(x => { const k = (x.nickname + "|" + x.restaurant).toLowerCase(); if(!m.has(k) || better(x, m.get(k))) m.set(k, x); }); return [...m.values()].sort((p, q) => better(p, q) ? -1 : 1); };
const backend = GS ? { live:true, config: () => gs("getConfig"), save: r => gs("saveScore", r), board: () => gs("getLeaderboard", 10) }
  : ENDPOINT ? { live:true, config: () => fetch(ENDPOINT + "?api=config").then(x => x.json()),
      save: r => fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(r)}).then(x => x.json()),
      board: () => fetch(ENDPOINT + "?api=board").then(x => x.json()) }
  : { live:false, config: async () => null,
      save: async r => { const a = loc.read(); const key = (r.nickname + "|" + r.restaurant).toLowerCase();
        const official = !a.some(x => x.official && (x.key === key || x.device === r.deviceId));
        const code = localCode();
        a.push({nickname:r.nickname, restaurant:r.restaurant, points:r.points, answerMs:r.answerMs || 0, totalQ:r.totalQ || 0, id:r.sessionId, official, key, device:r.deviceId, code}); loc.write(a);
        return {rank: official ? bestOf(a.filter(x => x.official)).findIndex(x => x.id === r.sessionId) + 1 : null, official, code, reason: official ? "" : "practice"}; },
      board: async () => bestOf(loc.read().filter(x => x.official !== false)).slice(0, 10) };

/* ================= sound: original effects + light background music (Web Audio, no files needed) ================= */
const AU = {
  ctx:null, master:null, fx:null, mus:null, on:true, timer:null, step:0, next:0, rain:null, file:null,
  init(){
    if(this.ctx){ if(this.ctx.state === "suspended") this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    try { this.ctx = new C(); } catch(e){ return; }
    this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
    this.fx = this.ctx.createGain(); this.fx.gain.value = +P.sfx_volume || 0.8; this.fx.connect(this.master);
    this.mus = this.ctx.createGain(); this.mus.gain.value = +P.music_volume || 0.3; this.mus.connect(this.master);
    this.master.gain.value = this.on ? 1 : 0;
    const url = String(P.order_sound_url || "").trim();
    if(url){ try { this.file = new Audio(url); this.file.preload = "auto"; } catch(e){ this.file = null; } }
  },
  setOn(v){
    this.on = v; if(this.master) this.master.gain.setTargetAtTime(v ? 1 : 0, this.ctx.currentTime, 0.05);
    $("b-sound").setAttribute("aria-pressed", v); $("snd-wave").toggleAttribute("hidden", !v); $("snd-x").toggleAttribute("hidden", v);
    try { localStorage.setItem("rushglovo.sound", v ? "1" : "0"); } catch(e){}
  },
  tone(f, t0, d, type = "sine", v = 0.3, dest, f2){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || this.fx); o.start(t); o.stop(t + d + 0.05);
  },
  noise(t0, d, v, freq = 3000, dest, type = "bandpass"){
    const c = this.ctx, n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
    for(let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + t0;
    s.buffer = b; f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(dest || this.fx); s.start(t);
  },
  play(name){
    if(!this.ctx || !this.on || !+P.sound_on) return;
    const T = (...a) => this.tone(...a);
    switch(name){
      case "order":
        if(this.file){ try { const a = this.file.cloneNode(); a.volume = Math.min(1, +P.sfx_volume || 0.8); a.play().catch(() => {}); return; } catch(e){} }
        T(1318, 0, .14, "triangle", .45); T(1760, .14, .22, "triangle", .45); T(1318, .42, .14, "triangle", .3); T(1760, .56, .26, "triangle", .3); break;
      case "accept": T(660, 0, .07, "square", .12); T(990, .07, .09, "square", .12); break;
      case "thud": T(150, 0, .16, "sine", .5, null, 70); break;
      case "pop": T(480, 0, .07, "sine", .35, null, 950); break;
      case "whoosh": this.noise(0, .4, .22, 900); break;
      case "ding": T(1568, 0, .7, "sine", .35); T(2093, 0, .7, "sine", .18); break;
      case "warn": T(440, 0, .1, "square", .14); T(440, .18, .1, "square", .14); break;
      case "perfect": T(784, 0, .09, "triangle", .3); T(1047, .09, .09, "triangle", .3); T(1319, .18, .16, "triangle", .3); break;
      case "bad": T(240, 0, .22, "sawtooth", .14, null, 150); break;
      case "coin": T(988, 0, .08, "square", .16); T(1319, .08, .3, "square", .16); break;
      case "buzz": T(110, 0, .4, "sawtooth", .18); T(116, 0, .4, "sawtooth", .12); break;
      case "notify": T(880, 0, .09, "sine", .3); T(1175, .1, .14, "sine", .3); break;
      case "down": T(660, 0, .35, "triangle", .28, null, 200); break;
      case "up": T(330, 0, .3, "triangle", .28, null, 880); break;
      case "ring": [0, .25, .5, .75].forEach(d => { T(1200, d, .1, "square", .1); T(1500, d + .1, .1, "square", .1); }); break;
      case "beep": T(1400, 0, .09, "square", .12); T(1400, .16, .09, "square", .12); break;
      case "tick": T(1900, 0, .04, "square", .1); break;
      case "tock": T(1250, 0, .05, "square", .1); break;
      case "door": this.noise(0, .5, .12, 400, null, "lowpass"); T(520, .35, .12, "sine", .25); T(780, .47, .2, "sine", .25); break;
      case "fanfare": [523, 659, 784, 1047].forEach((f, i) => T(f, i * .13, i === 3 ? .6 : .14, "triangle", .3)); break;
    }
  },
  // music: 112 bpm, Am - F - C - G, 8 eighth-notes per bar; brighter hats while it rains
  startMusic(){
    if(!this.ctx || !+P.music_on || this.timer) return;
    this.step = 0; this.next = this.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.schedule(), 30);
  },
  stopMusic(){ clearInterval(this.timer); this.timer = null; },
  schedule(){
    const c = this.ctx, e8 = 60 / 112 / 2;
    const chords = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
    const hz = n => 440 * Math.pow(2, (n - 69) / 12);
    while(this.next < c.currentTime + 0.15){
      const st = this.step % 8, ch = chords[Math.floor(this.step / 8) % 4], at = this.next - c.currentTime;
      if(st === 0 || st === 3 || st === 4 || st === 6) this.tone(hz(ch[0] - 12), at, e8 * 0.9, "triangle", .32, this.mus);
      if(st === 2 || st === 6) ch.forEach(n => this.tone(hz(n), at, e8 * 0.7, "square", .035, this.mus));
      if(st === 1 || st === 5 || st === 7){ const n = ch[(this.step * 7) % 3] + 12; this.tone(hz(n), at, e8 * 0.6, "triangle", .08, this.mus); }
      this.noise(at, 0.04, (st % 2 ? .05 : .025) * (S && S.rain ? 1.8 : 1), 8000, this.mus, "highpass");
      this.next += e8; this.step++;
    }
  },
  rainOn(v){
    if(!this.ctx) return;
    if(v && !this.rain){
      const c = this.ctx, n = c.sampleRate * 2, b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
      for(let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = b; s.loop = true; f.type = "lowpass"; f.frequency.value = 1400; g.gain.value = 0.07;
      s.connect(f); f.connect(g); g.connect(this.fx); s.start(); this.rain = s;
    } else if(!v && this.rain){ try { this.rain.stop(); } catch(e){} this.rain = null; }
  }
};

/* ================= scoring ================= */
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
function metrics(){
  const m = S.m, cancels = m.missed + m.stockCancels + m.lateCancels + m.complaints, resolved = m.delivered + m.missed + m.stockCancels + m.lateCancels;
  const uptime = S.t > 0 ? 1 - S.downtime / S.t : 1;
  const cancelRate = cancels / (resolved + 4);   // 4 clean orders of prior so one early mistake doesn't crater the score
  const bakes = m.perfect + m.raw + m.burnt;
  const prepAcc = bakes ? clamp((m.perfect - 0.5 * m.courierWaits) / bakes) : 1;
  const ps = Math.round(100 * (0.35 * clamp((uptime - 0.85) / 0.15) + 0.40 * clamp(1 - cancelRate / 0.08) + 0.25 * prepAcc));
  return {cancels, uptime, cancelRate, prepAcc, ps};
}

/* ================= messages: big pausing cards for scenario moments, toasts for feedback ================= */
let popT;
const FROM = {kitchen:["from_kitchen","C"], am:["from_am","O"], weather:["from_weather","!"], supplier:["from_supplier","F"], tablet:["from_tablet","!"], courier:["from_courier","G"],

/* card(key, vars, kind, from, opts): opts.buttons = [{t:"strKey", fn, ghost}] for a decision; opts.done = called when closed.

function card(key, vars, kind = "event", from = "am", opts = {}){
  if(!+P.pause_on_events && !opts.buttons && !opts.done && !opts.force) return toast(key, vars, kind, from);

$("card-btns").addEventListener("click", e => {

/* ================= tickets ================= */
function spawn(){
  const open = S.tickets.filter(x => x.state !== "done").length;
  const waitingAccept = S.tickets.filter(x => x.state === "new" || x.state === "flag").length;
  const camp = S.adsUntil > S.t || S.promoUntil > S.t;
  if((+P.max_open_tickets > 0 && open >= +P.max_open_tickets + (camp ? 2 : 0)) || (+P.max_new_tickets > 0 && waitingAccept >= +P.max_new_tickets + (camp ? 1 : 0))) return;
  const avail = PIZZAS.filter(p => S.menuOn[p.id]);
  if(!avail.length) return;
  const p = avail[Math.floor(Math.random() * avail.length)];
  const flagged = p.ing.some(i => S.outUntil[i] > S.t);
  const bo = boosts(), r = Math.random() * (1 + bo.ads + bo.promo) * (S.burstLeft > 0 ? 0.3 : 1);
  const ads = r < bo.ads, promo = !ads && r < bo.ads + bo.promo;
  const full = price(p), cut = promo ? Math.round(full * (+P.promo_discount || 0.2)) : 0;
  S.spawned++;
  S.tickets.push({id:S.id++, pz:p, state: flagged ? "flag" : "new", age:0, ads, promo, cut, price: full - cut + (+P.delivery_fee_tnd || 0),
    noBag: S.spawned === +P.nobag_order, noShow: S.spawned === +P.noshow_order, rain: S.rain});
  sfx("order"); renderRail();
  if(open + 1 >= (P.overload_tickets || 4)){ if(!S.seen.overload) tev("overload"); teach("overload", null, "event", "am"); }
}
function interval(){
  let base;
  if(S.emergency) base = P.spawn_interval_end_s;
  else if(S.rain) base = P.rain_spawn_interval_s;
  else if(S.rainStage === 2) base = P.after_rain_interval_s;
  else { const f = clamp(S.t / Math.max(1, P.ramp_until_s)); base = P.spawn_interval_start_s + (P.spawn_interval_end_s - P.spawn_interval_start_s) * f; }
  const bo = boosts(); base = base / (1 + bo.ads + bo.promo);
  const open = S.tickets.filter(x => x.state !== "done").length;   // the busier the kitchen, the calmer the flow
  return base * (0.85 + Math.random() * 0.3) + open * (+P.slowdown_per_open_ticket_s || 0);
}
function spawnForced(pz, flag){
  S.spawned++;
  const tk = {id:S.id++, pz, state: flag ? "flag" : "new", age:0, ads:false, promo:false, cut:0, price: price(pz) + (+P.delivery_fee_tnd || 0), rain:S.rain};
  S.tickets.push(tk); sfx("order"); renderRail(); return tk;
}
function boosts(){ return { ads: S.adsUntil > S.t ? (+P.ads_boost || 0.6) * metrics().ps / 100 : 0, promo: S.promoUntil > S.t ? (+P.promo_boost || 0.5) : 0 }; }
function freeSlot(){ return S.slots.findIndex(s => s === null); }
function accept(tk){
  if(tk.state !== "new") return;
  tk.state = "queued"; tk.age = 0; sfx("accept");
  tk.courier = {at: tk.noShow ? 1e9 : S.t + (S.train ? (+P.train_courier_delay_s || 8) : P.courier_delay_s + Math.random() * 4), slot:-1, wait:0, warned:false, noBag: tk.noBag};
  renderRail(); tev("accept", tk);
}
function closeTicket(tk, why){
  tk.state = "done";
  if(why === "missed") S.m.missed++; else if(why === "stock") S.m.stockCancels++; else if(why === "late") S.m.lateCancels++;
  if(tk.rain) S.m.rainLost++;
  if(S.emergency && !S.closed) S.m.leftOpenCancels++;
  if(tk.courier && tk.courier.slot >= 0) S.slots[tk.courier.slot] = null;
  if(S.table && S.table.t === tk) S.table = null;
  S.ovens.forEach((o, i) => { if(o && o.t === tk) S.ovens[i] = null; });
  S.pass = S.pass.filter(x => x.t !== tk);
  [S.chef, S.pzo, S.cook].forEach(a => { if(a.hold && a.hold.t === tk) a.hold = null; if(a.carry && a.carry.t === tk) a.carry = null; });
  renderRail();
}
function stageOf(tk){
  if(S.table && S.table.t === tk) return t("stTable");
  if(S.pzo.carry && S.pzo.carry.t === tk) return t("stToOven");
  if(S.ovens.some(o => o && o.t === tk)) return t("stOven");
  if(S.cook.carry && S.cook.carry.t === tk) return t("stToPass");
  if(S.pass.some(x => x.t === tk)) return t("stPass");
  if(S.chef.hold && S.chef.hold.t === tk) return t("stHands");
  if(tk.state === "waiting") return t("stWait");
  return t("stPrep");
}
function renderRail(){
  const r = $("rail"); const live = S.tickets.filter(x => x.state !== "done");
  if(!live.length){ r.innerHTML = `<span class="none">${S.phase === "intro" || S.closed ? t("railClosed") : S.offline ? t("railOffline") : S.busyUntil > S.t ? t("railBusy") : t("railEmpty")}</span>`; return; }
  r.innerHTML = live.map(tk => {
    const onb = S.table && S.table.t === tk;
    let foot;
    if(tk.state === "new"){ const l = Math.max(0, P.accept_time_s - tk.age); foot = `<div class="meter ${l < 6 ? "warn" : ""}"><i style="width:${l / P.accept_time_s * 100}%"></i></div><button class="acc ${trHl() === "accept" ? "hl" : ""}" data-a="acc" data-id="${tk.id}">${t("accept")}${S.train ? "" : " · " + Math.ceil(l)}</button>`; }
    else if(tk.state === "flag"){ const l = Math.max(0, P.flag_time_s - tk.age); foot = `<div class="st" style="color:var(--chili)">${t("outOfStock")}${S.train ? "" : " · " + Math.ceil(l)}</div><div class="row"><button class="call ${trHl() === "call" ? "hl" : ""}" data-a="call" data-id="${tk.id}">${t("call")}</button><button class="cx" data-a="cx" data-id="${tk.id}">${t("cancel")}</button></div>`; }
    else foot = `<div class="st">${stageOf(tk)}</div>`;
    const ready = S.pass.some(x => x.t === tk);
    return `<div class="tk ${tk.state === "new" ? "new" : tk.state === "flag" ? "flag" : ready ? "onboard" : ""}"><div class="h"><span>#${tk.id}</span>${tk.ads ? "<em>Ads</em>" : tk.promo ? "<em>Promo</em>" : ""}</div><div class="n">${esc(pzName(tk.pz))}</div><div class="ing">${tk.pz.ing.map(i => `<i style="background:${ING[i]}" title="${esc(ingName(i))}"></i>`).join("")}</div>${foot}</div>`;
  }).join("");
}
function tapTicket(a, id){
  if(!S.run || S.pause) return;
  const tk = S.tickets.find(x => x.id === id); if(!tk) return;
  if(a === "acc") accept(tk);
