    if(S.train){ S.m.stockCancels = 0; card("cancel_stock_manual", null, "bad", "am", {force:true, done: () => card("x", null, "event", "train", {force:true, text: t("trainWrong"), done: () => spawnForced(tk.pz, true)})}); }
    else teach("cancel_stock_manual", null, "bad"); }
  else if(a === "call" && tk.state === "flag"){

    tk.pz = ok[0] || PIZZAS[0]; tk.price = price(tk.pz) - (tk.cut || 0) + (+P.delivery_fee_tnd || 0); S.m.saved++;

/* ================= staff: the pizzaiolo and the oven cook work on their own; the player is the cashier ================= */
const go = (p, then, dur = 0.3) => ({x:p.x, y:p.y, dur, then});
function enqueue(task){ if(S.queue.length >= 4){ say("sOne"); return; } S.queue.push(task); }
function talk(a, k, v){ a.say = t(k, v); a.sayT = 2.4; }
function inKitchen(tk){ return (S.table && S.table.t === tk) || S.ovens.some(o => o && o.t === tk) || S.pass.some(x => x.t === tk)
  || [S.chef, S.pzo, S.cook].some(a => (a.carry && a.carry.t === tk) || (a.hold && a.hold.t === tk)); }
function pizzaioloAI(){
  const a = S.pzo; if(a.q.length || a.busyT > 0 || a.doing) return;
  if(a.carry){
    const k = S.ovens.findIndex(o => !o);
    if(k < 0){ if(!a.waitSaid){ a.waitSaid = 1; talk(a, "sOvenFull"); } return; }
    a.waitSaid = 0;
    a.q.push(go(stand["oven" + k + "p"], () => { if(S.ovens[k] || !a.carry) return; S.ovens[k] = {t:a.carry.t, ing:a.carry.ing, bake:0}; a.carry = null; talk(a, "sInOven"); sfx("whoosh"); renderRail(); }, 0.4));
    return;
  }
  if(S.table){
    const tk = S.table.t;
    if(tk.state !== "queued"){ S.table = null; return; }
    const miss = tk.pz.ing.find(i => !S.table.ing.includes(i));
    if(miss){
      const bi = BINS.indexOf(miss);
      a.q.push(go(stand.bin(bi), () => {
        if(S.outUntil[miss] > S.t){ talk(a, "sOut", {ing: ingName(miss)}); sfx("bad"); tk.state = "flag"; tk.age = 0; if(S.table && S.table.t === tk) S.table = null; a.q.length = 0; renderRail();
          teach("kitchen_stockout", {id: tk.id, ing: ingName(miss)}, "bad", "pizzaiolo"); tev("flag", tk); return; }
        a.carryIng = miss; }, 0.4));
      a.q.push(go(stand.table, () => { if(a.carryIng && S.table && S.table.t === tk && !S.table.ing.includes(a.carryIng)){ S.table.ing.push(a.carryIng); sfx("pop"); } a.carryIng = null; }, 0.5));
      return;
    }
    a.carry = S.table; S.table = null; renderRail(); return;
  }
  const tk = S.tickets.find(x => x.state === "queued" && !inKitchen(x)); if(!tk) return;
  a.q.push(go(stand.table, () => { if(tk.state !== "queued" || inKitchen(tk) || S.table) return; S.table = {t:tk, ing:[]}; talk(a, "sDough"); sfx("thud"); renderRail(); }, +P.dough_time_s || 1.2));
}
function cookAI(){
  const a = S.cook; if(a.q.length || a.busyT > 0 || a.doing) return;
  if(a.carry){ a.q.push(go(stand.pass, () => { const it = a.carry; S.pass.push(it); a.carry = null; talk(a, "sReadyPass"); sfx("ding"); renderRail(); tev("pass", it); }, 0.4)); a.q.push(go(stand.cookHome, null, 0)); return; }
  const k = S.ovens.findIndex(o => o && o.bake >= P.bake_time_s);

    if(willBurn && S.ovens[k].bake < P.bake_perfect_until_s + 2){ if(!a.phoneSaid){ a.phoneSaid = 1; talk(a, "sCookPhone"); } return; }   // the cook is distracted: this one burns
    a.q.push(go(stand["oven" + k], () => { const o = S.ovens[k]; if(!o) return; S.outCount = (S.outCount || 0) + 1;

/* the cashier: tablet, pass -> courier */

const cv = $("cv"), cx = cv.getContext("2d");

function fit(){
  const st = $("stage").getBoundingClientRect();

  if(h < 520){ s = st.height / 520; h = 520; }       // very short screens: keep the full kitchen, narrower
  h = Math.min(h, 980);
  relayout(Math.floor(h));
  scale = s; dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  const pw = Math.min(st.width - 8, 460), pop = $("pop");
  // notifications float in the middle of the kitchen (over the work table, which runs by itself), always fully on screen
  pop.style.top = (H * s * 0.5) + "px"; pop.style.width = pw + "px"; pop.style.left = "50%"; pop.style.marginLeft = (-pw / 2) + "px";
}
window.addEventListener("resize", fit);
if(window.ResizeObserver) new ResizeObserver(() => fit()).observe($("stage"));
const inR = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

  // scenario

  });

}
function moveActor(a, dt){
  const speed = a === S.chef ? (+P.chef_speed || 230) : (+P.staff_speed || 150);
  if(a.busyT > 0 || a.doing){ a.busyT -= dt; if(a.busyT <= 0){ const f = a.doing; a.doing = null; a.busyT = 0; if(f) f(); } }
  else if(a.q.length){
    const q = a.q[0]; a.tx = q.x; a.ty = q.y;
    const dx = q.x - a.x, dy = q.y - a.y, d = Math.hypot(dx, dy), sp = speed * dt;
    if(Math.abs(dx) > 2) a.face = dx > 0 ? 1 : -1;
    if(d <= sp){ a.x = q.x; a.y = q.y; a.q.shift(); a.busyT = q.dur || 0; a.doing = q.then || null; }
    else { a.x += dx / d * sp; a.y += dy / d * sp; }
  }
  if(a.sayT > 0) a.sayT -= dt;
}

  fit(); renderRail(); hud(); last = performance.now();
  AU.init(); AU.rainOn(false);
  if(S.phase === "intro") startIntro();
  else { AU.startMusic(); S.spawnIn = P.first_order_after_s; card("intro_opened", null, "good", "am", {force:true}); }
}
const boldLead = s => { const i = s.indexOf(":"); return i > 0 ? `<b>${esc(s.slice(0, i))}</b>${esc(s.slice(i))}` : esc(s); };
function tipsFor(k){
  const m = S.m, out = [], min = Math.round(S.downtime / Math.max(1, P.emergency_s) * P.game_span_minutes);
  if(k.uptime < 0.95) out.push([3, msg("tip_uptime", {uptime: (k.uptime * 100).toFixed(1), min})]);
  if(m.stockCancels) out.push([3, msg("tip_stock", {n: m.stockCancels})]);
  if(m.missed) out.push([2.6, msg("tip_missed", {n: m.missed})]);
  if(m.complaints) out.push([2.5, msg("tip_complaints", {n: m.complaints})]);
  if(m.lateCancels + m.courierWaits) out.push([2.2, msg("tip_courier", {n: m.lateCancels + m.courierWaits})]);
  if(m.adsSpend){ const roas = (m.adsGmv / m.adsSpend).toFixed(1), score = m.adsScore; out.push(score < 75 ? [2.4, msg("tip_ads_low", {score, roas})] : [1, msg("tip_ads_good", {score, roas})]); }
  else if(k.ps >= 80 && !m.promoUses) out.push([1.5, msg("tip_no_ads")]);
  if(m.promoOrders) out.push([1.1, msg("tip_promo", {n: m.promoOrders, pct: Math.round((+P.promo_discount || 0.2) * 100)})]);
  if(m.saved) out.push([1, msg("tip_saved", {n: m.saved})]);
  if(m.badHandovers) out.push([2.8, msg("tip_nobag")]);
  if(m.supportCalls) out.push([1.2, msg("tip_support", {n: m.supportCalls})]);
  if(S.emergency && !S.closedProperly) out.push([3.2, msg("tip_left_open", {n: m.leftOpenCancels})]);
  if(S.closedProperly) out.push([0.9, msg("tip_closed_good")]);
  if(m.rainLost >= 2 && !m.busy) out.push([2.3, msg("tip_busy", {n: m.rainLost})]);
  if(!out.length) out.push([0, msg("tip_perfect")]);
  return out.sort((a, b) => b[0] - a[0]).slice(0, 3).map(x => boldLead(x[1]));
}
async function finish(){
  if(!S.run) return;
  S.closed = true; hud(); renderRail();
  S.run = false; AU.stopMusic(); AU.rainOn(false); sfx("fanfare"); cardQueue = []; ["s-tab","s-ads","s-card"].forEach(id => $(id).hidden = true);
  const k = metrics(), m = S.m, cost = m.adsSpend;
  const points = Math.max(0, Math.round(m.gmv - cost + k.ps * P.points_per_score_point));
  const nick = $("nick").value.trim().slice(0, 20), resto = $("resto").value.trim().slice(0, 30);
  $("end-who").textContent = t("endWho", {resto}); $("pts").textContent = points; $("pts-lbl").textContent = t("pointsRank"); $("tips-title").textContent = t("tipsTitle");
  const roas = m.adsSpend ? m.adsGmv / m.adsSpend : null;
  const kp = [["kScore", k.ps, k.ps >= 80], ["kUptime", (k.uptime * 100).toFixed(1) + "%", k.uptime >= .95], ["kCancel", (k.cancelRate * 100).toFixed(1) + "%", k.cancelRate <= .02],
    ["kSales", m.gmv + " " + t("tnd"), true], ["kDelivered", m.delivered, true], ["kRoas", m.adsSpend ? roas.toFixed(1) : "—", !m.adsSpend || roas >= 3]];
  $("kpis").innerHTML = kp.map(([l, v, ok]) => `<div class="kpi ${ok ? "ok" : "ko"}"><small>${t(l)}</small><b>${v}</b></div>`).join("");
  $("tips").innerHTML = tipsFor(k).map(x => `<li>${x}</li>`).join("");
  $("s-end").hidden = false; $("rank").textContent = "…"; $("board").innerHTML = ""; $("board-note").textContent = "";
  const rec = { sessionId: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), nickname:nick, restaurant:resto, lang:LANG, points,
    gmv:m.gmv, partnerScore:k.ps, uptime:+k.uptime.toFixed(4), cancelRate:+k.cancelRate.toFixed(4), delivered:m.delivered, cancelled:k.cancels,
    missed:m.missed, stockCancels:m.stockCancels, lateCancels:m.lateCancels, complaints:m.complaints, raw:m.raw, burnt:m.burnt, perfect:m.perfect,
    courierWaits:m.courierWaits, savedSales:m.saved, busyUses:m.busy, supportCalls:m.supportCalls, badHandovers:m.badHandovers,
    closedProperly:S.closedProperly, leftOpenCancels:m.leftOpenCancels, adsBought: m.adsSpend > 0, adsScoreAtLaunch: m.adsScore,
    adsGmv:m.adsGmv, roas: m.adsSpend ? +roas.toFixed(2) : "", adsSpend:m.adsSpend, adsLaunches:m.adsLaunches, promoUses:m.promoUses, promoOrders:m.promoOrders,
    deviceId: DEVICE, version:"5.0" };
  $("codebox").hidden = true;
  try {
    const r = await backend.save(rec);
    $("rank").textContent = r && r.rank && r.official !== false ? "#" + r.rank : "—";
    if(r && r.code){
      $("code").textContent = r.code; $("codebox").hidden = false;
      $("codebox").className = "codebox" + (r.official === false ? " practice" : "");
      $("code-note").textContent = r.official === false ? t(r.reason === "outside" ? "codeOutside" : "codePractice") : t("codeOfficial");
      if(r.official !== false){ try { localStorage.setItem("rushglovo.official", JSON.stringify({code:r.code, pts:points, nick, resto})); } catch(e){} }
    }
  }
  catch(e){ $("rank").textContent = "—"; $("board-note").textContent = t("saveFail"); }
  try { const b = await backend.board();
    $("board").innerHTML = b.map(x => `<li class="${x.nickname === nick && x.restaurant === resto ? "me" : ""}"><span class="who">${esc(x.nickname)} <small>· ${esc(x.restaurant)}</small></span><span class="pts">${x.points}</span></li>`).join("");
    if(!backend.live) $("board-note").textContent = t("boardDemo");
  } catch(e){}
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

/* ================= boot ================= */
S = freshGame();
let saved = "fr"; try { saved = localStorage.getItem("rushglovo.lang") || ((navigator.language || "").startsWith("ar") ? "ar" : (navigator.language || "").startsWith("en") ? "en" : "fr"); } catch(e){}
setLang(saved);
try { AU.setOn(localStorage.getItem("rushglovo.sound") !== "0"); } catch(e){ AU.setOn(true); }
fit(); renderRail(); requestAnimationFrame(tm => { last = tm; tick(tm); });
if(window.__rushTest) window.__rush = {S: () => S, tapStation, startTraining, trHl, QZ, startQuiz};
Promise.race([backend.config(), new Promise(r => setTimeout(() => r(null), 6000))])
  .then(cfg => { if(cfg){ applyConfig(cfg); localBtn(); S = freshGame(); setLang(LANG); renderRail(); } })
  .catch(() => {});
})();
</script>
